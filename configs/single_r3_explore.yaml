# Round 3 E — 探索臂：治本(②) + 大 lr（解凍搜尋）
# = single_r2_enstrust_harvest（dlf+ensemble+trust、direct 8 候選）唯一變因：lr 0.005→0.015。
# 假設：Round-2 ①② 每 epoch 只翻 ~6 像素 = 搜尋凍住（ensemble 平均使 SM 地形超穩、generator 步太小）
#   → 加大步長探索能否解凍 + 變好。判準：**同時看**「像素翻轉數(探索量)」與 worst_margin(結果)。對照 ②。
# 為何用 lr 當探索旋鈕：它是唯一對 direct & sigmoid 都適用的、保 E/D/E+D factorial 乾淨；
#   UCB(selection.uncertainty_weight)/diversity 是候選式、sigmoid 用不了 → 之後另做 direct-only 子臂。
name: pixel_single_r3_explore
port: single

epochs: 500
lr: 0.015                           # ← 唯一變因 vs ②（0.005→0.015，3× 步長探索）
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1
  uncertainty: 0.05

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: dlf
  newest_steps: 50
  replay_size: 256

scheduler:
  on_plateau: linear

generator:
  name: direct
  num_candidates: 8

selection:
  diversity_weight: 0.1
  uncertainty_weight: 0.02

surrogate:
  name: ensemble
  ensemble_size: 5
  init_perturb: 0.02
  pretrained: sm_harvest.pth
  offline_dataset: harvest_single

trust:
  enable: true
  g0: 1.0
  ema: 0.3
  t_min: 0.05
  t_max: 0.95
  tau_inflate: 3.0

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 0.1
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  n_basis: 8
  freeze_trunk: true
  sm_max_epoch: 1000
