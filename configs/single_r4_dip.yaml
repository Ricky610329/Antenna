# Round 4 D — DIP 臂 + 自適應 SM 訓練量
# = single_r3_dip（sigmoid 單候選、lr 0.005、dlf+ensemble+trust）唯一變因：sm_train.mode dlf→adaptive。
# 假設同 R4 E：修 SM 欠訓（自適應每輪 elite 重訓 epoch 數）→ trust 升 → 利用 → 破 plateau。
#   對照 R3 D（固定 dlf；r_feed 0.95 連通先驗成功但 best@ep8 停滯、loss 沒轉好）。
name: pixel_single_r4_dip
port: single

epochs: 500
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1
  uncertainty: 0.05

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: adaptive                    # ← 唯一變因 vs R3 D（dlf → 自適應訓練量）
  newest_steps: 50
  replay_size: 256

adaptive:
  snapshots: 5
  epoch_min: 1
  epoch_max: 32
  ema: 0.3

scheduler:
  on_plateau: linear

generator:
  name: sigmoid                     # DIP 架構連通先驗（單候選）

surrogate:
  name: ensemble
  ensemble_size: 5
  init_perturb: 0.02
  pretrained: sm_harvest.pth
  offline_dataset: harvest_single

trust:
  enable: true
  g0: 1.0
  ema: 0.3
  t_min: 0.05
  t_max: 0.95
  tau_inflate: 3.0

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 0.1
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  n_basis: 8
  freeze_trunk: true
  sm_max_epoch: 1000
