# 單埠 + SC + 方向圖 + SM 經驗回放（replay）  (port=single)
# 對標 single_sc_rad.yaml：唯一差異 = sm_train.mode: replay。
# 用途：A/B —— 把 SM 線上更新從「最新一筆擬到收斂（反模式，會 catastrophic forgetting
#       + 暴衝到 6634 步）」改成「最新少數步 + 經驗回放緩衝一遍」，看品質（防遺忘）與
#       速度（削暴衝尾巴）是否更好。replay 是 opt-in；single_sc_rad 維持原樣（mode 預設 single）。
# 參考：streaming-regression experience replay；學長 online/DLF 是這條路的雛形。
name: pixel_single_sc_rad_replay
port: single

epochs: 1000
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: replay            # ← 唯一變因：SM 改用經驗回放（最新少數步 + 緩衝重訓）
  newest_steps: 50        # 對「最新一筆」跑幾步（取代擬到收斂）
  replay_size: 256        # 經驗回放緩衝容量（FIFO，滿了丟最舊）

scheduler:
  on_plateau: linear

generator: sigmoid

surrogate:
  pretrained: old_sm.pth
  offline_dataset: harvest_single

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 1.0
  window_deg: 55
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  freeze_trunk: true
  sm_max_epoch: 1000
