# 單埠 + SC + 方向圖 + DLF + Boundary + 多尺度淺層生成器  (port=single)
# 對標 single_sc_rad_boundary.yaml：唯一變因 = generator: multiscale。
# 用途：cold-start 視角的「generator = 重參數化/先驗」——多尺度加性 (1×1/5×5/13×13 上採樣相加)、
#       淺層少參數。A/B 看「coarse-to-fine 連通先驗 + 按尺度退火」能否比 dense MLP(sigmoid) 更快/更好，
#       並順帶看是否減少對 SC 的依賴 (最細 13×13 → 輸出偏連通平滑)。
# ⚠ 表達力：最細只到 13×13，太細的單像素特徵可能擬不出；不夠再把更大尺度加進 generator.scales。
name: pixel_single_sc_rad_boundary_multiscale
port: single

epochs: 1000
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1          # trust-region 正則（與三代 A/B 同 recipe）

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: dlf
  newest_steps: 50
  replay_size: 256

scheduler:
  on_plateau: linear

generator:               # ← 唯一變因：多尺度淺層加性生成器 (cold-start 連通先驗)
  name: multiscale
  scales: [1, 5, 13]     # 各尺度小頭 → 上採樣到 25×25 相加；最細 13×13 → band-limited 偏連通

surrogate:
  pretrained: sm_harvest.pth        # 自訓 SM 初始化 (old_sm.pth 對我們資料 ≈隨機；val MSE 13 vs 38)
  offline_dataset: harvest_single

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 1.0
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  freeze_trunk: true
  sm_max_epoch: 1000
