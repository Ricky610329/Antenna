# R81 filter spec v6 (2026-10-15 17:45, senior: sweep 11-40 GHz, suppress Ku band and n260; -20 dB stopbands).
# S21 pass 26-30 GHz >= -3 dB; stop 11-19 and 36-40 GHz <= -20 dB; 19-26 GHz is a free transition band.
# S11/S22 26.5-29.5 GHz <= -10 dB kept (Ricky: S11/S22 must pass too).
# open_region_freq stays 16 GHz so solver setup matches all earlier R81 truth (only the sweep window changes);
# below 16 GHz the radiation boundary is closer than lambda/4, so 11-16 GHz values carry that caveat.
name: dual_r81_v6
port: dual
scope: symmetry_filter_20261007
measurement:
  name: dual25_p01_db075_11_40_discrete_v6
  port: dual
  labels: [S11, S21, S22]
  geometry: {geom: p01, pixel_count: 25, diag_bridge_w: 0.075}
  sweep: {start_ghz: 11, stop_ghz: 40, step_ghz: 0.5, type: Discrete}
  solver: {setup_freq_ghz: 28, open_region_freq_ghz: 16, max_delta_s: 0.02, max_passes: 6, min_passes: 5, min_converged: 5}
score_spec:
  name: filter_s21_11_40_stop20db_s11s22_match10_v6
  bands:
    - {name: s21_pass, label: S21, start_ghz: 26, stop_ghz: 30, relation: ge, threshold: -3}
    - {name: s21_low_stop, label: S21, start_ghz: 11, stop_ghz: 19, relation: le, threshold: -20}
    - {name: s21_high_stop, label: S21, start_ghz: 36, stop_ghz: 40, relation: le, threshold: -20}
    - {name: s11_match, label: S11, start_ghz: 26.5, stop_ghz: 29.5, relation: le, threshold: -10}
    - {name: s22_match, label: S22, start_ghz: 26.5, stop_ghz: 29.5, relation: le, threshold: -10}
runtime: {timeout: 1200}   # 2026-10-20：2400→1200（706 筆最長 936 s；218 卡 32 分才 COM 例外，縮短止損）
