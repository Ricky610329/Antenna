# 單埠 + SC + 方向圖 + DLF + Boundary + 左右鏡像對稱生成器  (port=single)
# 對標 single_sc_rad_boundary.yaml：唯一差異 = generator: mirror。
# 用途：把「對稱約束做進生成器」疊到現役最強 recipe (SC+rad+boundary+dlf) 上，
#       A/B 看天生對稱 + 搜尋空間砍半，在 trust-region 前線上能否更快/主波束更好。
name: pixel_single_sc_rad_boundary_mirror
port: single

epochs: 1000
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1          # trust-region 正則（拉 G 回 SM 已見分布；權重待 A/B 調）

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: dlf             # boundary 需要緩衝 → 配 dlf（全收 + 菁英過濾）
  newest_steps: 50
  replay_size: 256

scheduler:
  on_plateau: linear

generator: mirror        # ← 唯一變因：MLP 出半邊 25×13→flip 成 25×25（對稱+搜尋空間砍半）

surrogate:
  pretrained: old_sm.pth
  offline_dataset: harvest_single

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 1.0
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  freeze_trunk: true
  sm_max_epoch: 1000
