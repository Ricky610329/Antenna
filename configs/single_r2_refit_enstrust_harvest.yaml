# Round 2 ③ — generator-free + ensemble + trust,refit 底｜全治本 × 最佳訓練底
# = Round 2 ②(single_r2_enstrust_harvest)的 SM 底從 dlf → refit(Round-1 sim_loss 最佳的廣覆蓋訓法)。
# 測「完整治本(ensemble+trust)+ 最強 SM 底」的上限。對照 Round-1 C(single_guided_refit_harvest,
# refit 單 SM)看 ensemble+trust 加上去有沒有用。
# ⚠ 成本:refit(整個 buffer 訓到 fit)× ensemble K 成員 → 每輪 SM 訓練量三個裡最大(HFSS 仍為主、但留意)。
name: pixel_single_r2_refit_enstrust_harvest
port: single

epochs: 500                         # 一次驗證跑到 500 epoch (2026-06-28 使用者定;約 3 天)
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1
  uncertainty: 0.05                 # λ_trust 上限 (閉迴路下 ×(1−t))

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: refit                       # 訓整個 buffer(不挑 elite)到 fit
  elite_epochs: 50                  # 每輪重訓 epoch 上限(配 min_loss=0.1 訓到收斂)
  replay_size: 256

scheduler:
  on_plateau: linear

generator:
  name: direct
  num_candidates: 8

selection:
  diversity_weight: 0.1
  uncertainty_weight: 0.02          # κ 上限 (閉迴路下 ×(1−t))

surrogate:
  name: ensemble
  ensemble_size: 5
  init_perturb: 0.02
  pretrained: sm_harvest.pth
  offline_dataset: harvest_single

trust:
  enable: true
  g0: 1.0
  ema: 0.3
  t_min: 0.05
  t_max: 0.95
  tau_inflate: 3.0

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 0.1
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  n_basis: 8                        # ← 老師:8 個 cosine mode 就夠
  freeze_trunk: true
  sm_max_epoch: 1000
