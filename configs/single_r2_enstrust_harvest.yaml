# Round 2 ② — generator-free + ensemble + trust (dlf 底)｜治本完整版
# 在 Round 2 ①(single_r2_ens_harvest)上開閉迴路信任控制(trust.enable):用 SM-vs-HFSS 的 gap
# 推出信任標量 t∈[0,1],同軸調 tau 乘子 / λ_trust / κ(語意見 docs/guided_search_design.md):
#   t→0(SM 失準):tau 放軟(別在盲區鎖定)、λ_trust/κ 收緊(拉回可信區+去修 SM);t→1:純 ACP 銳化收割。
# 隔離變因 vs Round2① = 「閉迴路 gap 控制 vs 靜態 ensemble」。對照 Round2① 與 Round-1 A。
# loss.uncertainty / selection.uncertainty_weight 在此當「base 上限」(被 (1−t) 調節)。
name: pixel_single_r2_enstrust_harvest
port: single

epochs: 1000
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1
  uncertainty: 0.05                 # λ_trust 上限 (閉迴路下 ×(1−t))

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: dlf
  newest_steps: 50
  replay_size: 256

scheduler:
  on_plateau: linear

generator:
  name: direct
  num_candidates: 8

selection:
  diversity_weight: 0.1
  uncertainty_weight: 0.02          # κ 上限 (閉迴路下 ×(1−t))

surrogate:
  name: ensemble
  ensemble_size: 5
  init_perturb: 0.02
  pretrained: sm_harvest.pth
  offline_dataset: harvest_single

trust:
  enable: true                      # 開閉迴路信任控制 (gap → t → tau/λ_trust/κ)
  g0: 1.0                           # 落差參考尺度:gap=g0 → t≈0.37 (失去大半信任)
  ema: 0.3                          # gap 的 EMA 係數 (信任逐步累積,不被單筆抖動牽走)
  t_min: 0.05
  t_max: 0.95
  tau_inflate: 3.0                  # t→0 時 tau 最多放軟幾倍

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 0.1
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  n_basis: 8                        # ← 老師:8 個 cosine mode 就夠
  freeze_trunk: true
  sm_max_epoch: 1000
