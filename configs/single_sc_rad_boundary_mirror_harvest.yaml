# 單埠 + SC + 方向圖 + DLF + Boundary + 鏡像對稱 + sm_harvest 初始化  (port=single)
# 對標 single_sc_rad_boundary_harvest.yaml：唯一變因 = generator: mirror。
# 用途：generator-prior 三代 A/B 之一 (對稱 prior)，與基準同 sm_harvest recipe。
# name 含 harvest → 全新結果夾，吃得到 sm_harvest (不會續跑舊 old_sm 夾)。
name: pixel_single_sc_rad_boundary_mirror_harvest
port: single

epochs: 1000
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: dlf
  newest_steps: 50
  replay_size: 256

scheduler:
  on_plateau: linear

generator: mirror        # ← 唯一變因：左右鏡像對稱 (MLP 出半邊 25×13→flip 成 25×25)

surrogate:
  pretrained: sm_harvest.pth
  offline_dataset: harvest_single

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 1.0
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  freeze_trunk: true
  sm_max_epoch: 1000
