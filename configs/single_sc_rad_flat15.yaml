# 單埠 + SC + 方向圖 loss，收緊「平整容忍」 (port=single)
# 對標 single_sc_rad.yaml：唯一差異 = radiation.floor_db 3 → 1.5
#   → 窗內容許 ripple 從 3dB 收到 1.5dB；term① 把掉到 G0−1.5 以下的點往上拉 = 更平更高。
# 用途：A/B —— 「純 config 收緊容忍」這條路線 vs baseline(floor_db=3) / flatloss(主動壓平 loss)。
name: pixel_single_sc_rad_flat15
port: single

epochs: 1000
lr: 0.005
patience: 10

loss:
  spectral_connectivity: 0.0005   # 與 single_sc 相同（論文主方法）

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000

scheduler:
  on_plateau: linear

generator: sigmoid

surrogate:
  pretrained: old_sm.pth
  offline_dataset: harvest_single

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 1.0
  window_deg: 45
  floor_db: 1.5           # ← 唯一變因：3 → 1.5（收緊平整容忍；越小越平越高、但越難收斂）
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  n_basis: 16
  freeze_trunk: true
  sm_max_epoch: 1000
