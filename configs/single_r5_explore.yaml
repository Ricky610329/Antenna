# Round 5 E — 探索臂 + 滑動視窗 SM 訓練量
# = single_r4_explore（direct 8 候選、lr 0.015、ensemble+trust）唯一變因：sm_train.mode adaptive→adaptive_window。
# 假設：R4 實測欠訓（每輪訓完 elite 訓練 loss 仍 ~8-11,離學長的 0.1 差兩個數量級）且 adaptive 探測自鎖低處
#   （target 停 3-5、探測曲線 80-100% 平坦、看不到上方）。滑動視窗（Ricky 設計）：每輪訓到視窗頂 hi、
#   log2 階梯快照、held-out argmin 連續貼頂→hi×2 / 貼底→hi÷2 → 訓練量有證據自己爬、無自鎖。
#   對照 R4 同臂。判準：sm_fit_loss 壓到 ~1-3 + sm_gap/sm_bias 降 + trust_t 升 + worst_margin。
name: pixel_single_r5_explore
port: single

epochs: 500
lr: 0.015
patience: 10

loss:
  spectral_connectivity: 0.0005
  boundary: 0.1
  uncertainty: 0.05

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000
  mode: adaptive_window             # ← 唯一變因 vs R4 同臂（adaptive → 滑動視窗訓練量）
  newest_steps: 50
  replay_size: 512                  # 加大暫存（500ep 後半不擠掉舊點）

adaptive:                           # 滑動視窗訓練量旋鈕（見 WindowSMTrainController / docs/discuss/decisions.md）
  snapshots: 5                      # log2 階梯採樣點數（hi, hi/2, …, hi/16）
  epoch_min: 8                      # 視窗頂 hi 的下限
  epoch_max: 256                    # 視窗頂 hi 的上限（2026-07-03 止血 1024→256：冷啟動超衝——elite 僅 ~12 筆時視窗直衝 1024,fit 壓到 0.2-0.9 過擬合+30分/ep;斷點續跑 seed_target 會把 hi 夾回此上限）
  hi_init: 64                       # hi 起點（fit_loss 收斂速率估的中間帶；有證據自己 ×2 往上爬）
  ema: 0.3                          # bucket 誤差 EMA（吸 K=1 單點雜訊）
  patience: 3                       # argmin 連續貼邊幾次才滑動（遲滯防震盪）

scheduler:
  on_plateau: linear

generator:
  name: direct
  num_candidates: 8

selection:
  diversity_weight: 0.1
  uncertainty_weight: 0.02

surrogate:
  name: ensemble
  ensemble_size: 3                  # ← R5 由 5 收成 3（使用者定：省 SM 訓練成本;不確定性估計略粗）
  init_perturb: 0.02
  pretrained: sm_harvest.pth
  offline_dataset: harvest_single

trust:
  enable: true
  g0: 1.0
  ema: 0.3
  t_min: 0.05
  t_max: 0.95
  tau_inflate: 3.0

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }

radiation:
  enable: true
  weight: 0.1
  window_deg: 45
  floor_db: 3
  boresight_weight: 1.0
  warmup_epochs: 30
  n_theta: 181
  n_basis: 8
  freeze_trunk: true
  sm_max_epoch: 1000
