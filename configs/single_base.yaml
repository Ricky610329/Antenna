# 單埠基準 (原 MultiConfig 1/2/5)  (port=single)
name: pixel_single_base
port: single

epochs: 1000
lr: 0.005
patience: 10

loss:
  total_variation: 0.0

sm_train:
  lr: 0.001
  min_loss: 0.1
  max_epoch: 20000

scheduler:
  on_plateau: linear

generator: sigmoid            # zoo 名字 (antenna/zoo.py)；可省略 → sigmoid
                              # 要微調架構/暖啟動: {name: sigmoid, hidden: [...], pretrained: xxx.pth}

surrogate:                    # SM 載入策略 (name 可省略 → mlp；hidden 選填微調)
  pretrained: old_sm.pth
  offline_dataset: patch_single_mirror
  # warmup: "1"               # 選填：KuoHung 參考圖樣編號，對 SM 做單筆暖身

targets:
  S11:  { side: 0,   center: -10, width: [5, 0, 7, 0, 5], method: low }
  Gain: { side: -19, center: 4,   width: [5, 0, 7, 0, 5], method: high }
