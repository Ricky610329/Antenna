[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antenna"
version = "0.1.0"
description = "PyTorch-based antenna optimization with HFSS integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "torchaudio",
    "numpy",
    "matplotlib",
    "pandas",
    "opencv-python",
    "loguru",
    "pydantic>=2.0",
    "wandb",
    "tqdm",
    "requests",
    "sentry-sdk",
    "PyYAML",
    "Pillow",
    "Flask",
    "psutil",
    "GitPython",
    "imageio-ffmpeg",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
]

[project.scripts]
antenna = "antenna.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["antenna"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = [
    "F401",   # unused imports — 遷移期間暫時忽略
    "F403",   # wildcard imports — Phase 1 逐步修復
    "F405",   # undefined from wildcard — F403 的附帶影響
    "F811",   # 重複定義 — overload 裝飾器與 wildcard imports 導致
    "F821",   # 未定義名稱 — wildcard imports 導致
    "F722",   # syntax error in forward annotation — 遷移期間暫時忽略
    "E402",   # import 不在頂部 — 遷移期間暫時忽略（config.device 設定順序）
    "E501",   # 行太長 — 由 formatter 處理
    "E722",   # bare except — 遷移期間暫時忽略
    "E741",   # 模糊變數名 — ML 程式碼常見 (l, I, O)
    "UP035",  # typing 舊式用法 — 遷移期間暫時忽略
]

[tool.ruff.lint.isort]
known-first-party = ["antenna"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
