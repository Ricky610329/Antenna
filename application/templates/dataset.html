<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset: {{ dataset_name }}</title>
    <link rel="icon" href="{{ url_for('static', filename = 'picture/house.ico') }}" type="image/x-icon" >
    <link rel="icon" href="{{ url_for('static', filename = 'picture/house.png') }}" type="image/png" >
    <link rel="shortcut icon" href="{{ url_for('static', filename = 'picture/house.ico') }}" type="image/x-icon" >
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sample-card {
            height: 100%;
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <i class="bi bi-broadcast-pin me-2"></i>
            Antenna Visualizer
        </a>
        <span class="navbar-text text-white">
            Dataset: {{ dataset_name }}
        </span>
        <a href="/" class="btn btn-outline-light btn-sm ms-auto">Back to List</a>
    </div>
</nav>

<div class="container">
    <div class="alert alert-info">
        <strong>Total Items:</strong> {{ total_items }} (Showing first {{ samples|length }} samples)
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="samplesContainer">
        <!-- Populated by JS -->
    </div>
</div>

<script>
    const samples = {{ samples | tojson }};

    function renderSamples() {
        const container = document.getElementById('samplesContainer');
        
        samples.forEach(sample => {
            const col = document.createElement('div');
            col.className = 'col';
            
            // Create Card
            col.innerHTML = `
                <div class="card sample-card shadow-sm">
                    <div class="card-header bg-light">
                        <strong>ID: ${sample.id}</strong>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <!-- Input (Assume Heatmap) -->
                            <div class="col-12 mb-3">
                                <h6 class="card-subtitle mb-2 text-muted">Input</h6>
                                <div style="display: flex; justify-content: center;">
                                    <canvas id="canvas-in-${sample.id}" width="150" height="150" style="width: 150px; height: 150px; border: 1px solid #eee;"></canvas>
                                </div>
                            </div>
                            <!-- Output (Assume Line Chart or Value) -->
                            <div class="col-12">
                                <h6 class="card-subtitle mb-2 text-muted">Output</h6>
                                <div style="height: 150px;">
                                    <canvas id="chart-out-${sample.id}"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(col);

            // Render Input (Heatmap)
            if (sample.input) {
                renderHeatmap(`canvas-in-${sample.id}`, sample.input);
            }

            // Render Output (Chart)
            if (sample.output) {
                renderLineChart(`chart-out-${sample.id}`, sample.output);
            }
        });
    }

    function renderHeatmap(canvasId, data) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        // Flatten if needed or handle dimensions
        // Simple case: 2D array or 1D array (vector)
        let rows = 1, cols = 1;
        let flatData = [];

        if (Array.isArray(data[0])) {
            rows = data.length;
            cols = data[0].length;
            flatData = data.flat(); // works if simple 2D
        } else {
            // Assume 1D vector -> make it square-ish or just strip?
            // Let's assume square for antenna pattern usually
            const len = data.length;
            const side = Math.sqrt(len);
            if (Number.isInteger(side)) {
                rows = side;
                cols = side;
            } else {
                // Just a vector strip
                cols = len;
            }
            flatData = data;
        }

        const cellW = w / cols;
        const cellH = h / rows;

        // Normalize
        let min = Math.min(...flatData);
        let max = Math.max(...flatData);
        if (max === min) max = min + 1;

        for (let i = 0; i < flatData.length; i++) {
            const r = Math.floor(i / cols);
            const c = i % cols;
            const val = flatData[i];
            const norm = (val - min) / (max - min);
            
            // Blue-ish
            const intensity = Math.floor(norm * 255);
            ctx.fillStyle = `rgb(0, ${intensity}, ${intensity+50})`;
            ctx.fillRect(c * cellW, r * cellH, cellW, cellH);
        }
    }

    function renderLineChart(canvasId, data) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        
        // Handle Multidimensional Output (e.g. Multi-port)
        let datasets = [];
        let labels = [];

        if (Array.isArray(data[0])) {
             const rows = data.length;
             const cols = data[0].length;
             labels = Array.from({length: cols}, (_, i) => i);
             
             for(let i=0; i<rows; i++) {
                 datasets.push({
                     label: `Port ${i+1}`,
                     data: data[i],
                     borderColor: `hsl(${(i*137)%360}, 70%, 50%)`,
                     borderWidth: 1,
                     pointRadius: 0,
                     tension: 0.1
                 });
             }
        } else {
            labels = data.map((_, i) => i);
            datasets.push({
                label: 'Response',
                data: data,
                borderColor: 'rgb(75, 192, 192)',
                borderWidth: 1,
                pointRadius: 0,
                tension: 0.1
            });
        }

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: datasets.length > 1 }
                },
                scales: {
                    x: { display: false },
                    y: { display: true }
                }
            }
        });
    }

    renderSamples();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
