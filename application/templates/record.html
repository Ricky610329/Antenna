<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record: {{ record_id }}</title>
    <link rel="icon" href="{{ url_for('static', filename = 'picture/house.ico') }}" type="image/x-icon" >
    <link rel="icon" href="{{ url_for('static', filename = 'picture/house.png') }}" type="image/png" >
    <link rel="shortcut icon" href="{{ url_for('static', filename = 'picture/house.ico') }}" type="image/x-icon" >
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <!-- Chart.js Annotation Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.0.1"></script>
    <style>
        .chart-container {
            position: relative;
            height: 40vh;
            width: 100%;
        }
        .gallery-img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gallery-img:hover {
            transform: scale(1.05);
        }
        #content-container {
            display: none; /* Initially hidden */
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <i class="bi bi-broadcast-pin me-2"></i>
            Antenna Visualizer
        </a>
        <span class="navbar-text text-white">
            Record: {{ record_id }}
        </span>
        <a href="/" class="btn btn-outline-light btn-sm ms-auto">Back to List</a>
    </div>
</nav>

<div class="container">
    <!-- Loading Indicator -->
    <div id="loading-indicator" class="text-center p-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading record data from NAS...</p>
    </div>

    <!-- Error Display -->
    <div id="error-container" class="alert alert-danger" role="alert" style="display: none;"></div>

    <!-- Main Content Area (Initially Hidden) -->
    <div id="content-container">
        <div class="row">
            <!-- Main Content Column -->
            <div class="col-lg-8">
                
                <!-- Global Control Section -->
                <div id="global-control-section" class="card mb-4 shadow-sm sticky-top" style="z-index: 1020; top: 1rem; display: none;">
                    <div class="card-body">
                        <label for="globalStepSlider" class="form-label fw-bold d-flex justify-content-between">
                            <span>Global Step Control</span>
                            <span id="globalStepLabel" class="badge bg-primary rounded-pill">Step: 0</span>
                        </label>
                        <input type="range" class="form-range" id="globalStepSlider" min="0" max="100" value="100">
                    </div>
                </div>

                <!-- Charts Section -->
                <div id="charts-section" class="card mb-4 shadow-sm" style="display: none;">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Training Metrics</h5>
                        <small id="record-name-source" class="text-muted"></small>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <select id="metricSelect" class="form-select" multiple size="5">
                                    <!-- Options populated by JS -->
                                </select>
                                <small class="text-muted">Hold Ctrl/Cmd to select multiple metrics.</small>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="metricsChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Response vs Target Section -->
                <div id="resp-target-section" class="card mb-4 shadow-sm" style="display:none;">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap">
                        <h5 class="mb-0">響應 vs 目標</h5>
                        <span class="small text-muted">紅虛線＝設計目標，實線＝模擬響應（拖上方 Step slider 看逼近過程）</span>
                    </div>
                    <div class="card-body">
                        <div class="row g-3" id="respTargetContainer"></div>
                    </div>
                </div>

                <!-- Matrix Visualization Section -->
                <div id="matrix-section" class="card mb-4 shadow-sm" style="display: none;">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Matrix Data Visualization</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-4" id="matrixContainer">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Gallery Section -->
                <div id="gallery-section" class="card mb-4 shadow-sm" style="display: none;">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Generated Images</h5>
                        <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#galleryCollapse" aria-expanded="false" aria-controls="galleryCollapse">
                            Toggle Images
                        </button>
                    </div>
                    <div class="collapse" id="galleryCollapse">
                        <div class="card-body">
                            <div id="gallery-container" class="row row-cols-2 row-cols-md-3 g-3">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Raw Data Section -->
                <div id="raw-data-section" class="card mb-4 shadow-sm" style="display: none;">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Raw Data (All)</h5>
                        <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#rawDataCollapse">
                            Show Data
                        </button>
                    </div>
                    <div class="collapse" id="rawDataCollapse">
                        <div class="card-body">
                            <div class="table-responsive" style="max-height: 400px; overflow: auto;">
                                <table class="table table-sm table-striped table-hover text-nowrap" id="rawDataTable">
                                    <thead>
                                        <!-- Populated by JS -->
                                    </thead>
                                    <tbody>
                                        <!-- Populated by JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar Column -->
            <div class="col-lg-4">
                 <!-- Config Section -->
                 <div id="config-section" class="card mb-4 shadow-sm" style="display: none;">
                     <div class="card-header bg-white">
                         <h5 class="mb-0">Configuration</h5>
                     </div>
                     <div class="card-body">
                         <pre class="bg-light p-2 rounded" style="max-height: 400px; overflow-y: auto;"><code id="config-data-pre"></code></pre>
                     </div>
                 </div>

                <!-- History/Metadata Section -->
                <div id="history-section" class="card mb-4 shadow-sm" style="display: none;">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">History / Metadata</h5>
                         <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#historyCollapse">
                            Show Info
                        </button>
                    </div>
                     <div class="collapse" id="historyCollapse">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table id="history-table" class="table table-sm table-striped">
                                    <thead></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const recordId = '{{ record_id }}';
    const loadingIndicator = document.getElementById('loading-indicator');
    const contentContainer = document.getElementById('content-container');
    const errorContainer = document.getElementById('error-container');

    fetch(`/api/record/${recordId}`)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(apiData => {
            loadingIndicator.style.display = 'none';
            
            if (apiData.error) {
                errorContainer.innerText = apiData.error;
                errorContainer.style.display = 'block';
                return;
            }
            
            contentContainer.style.display = 'block';
            
            // --- DECOUPLED RENDER FUNCTIONS ---
            
            const renderImages = (images) => {
                const container = document.getElementById('gallery-container');
                if (!images || images.length === 0) return;
                
                document.getElementById('gallery-section').style.display = 'block';
                let html = '';
                images.forEach(img => {
                    html += `
                        <div class="col">
                            <div class="card h-100 border-0">
                                <a href="/result/${recordId}/${img}" target="_blank">
                                    <img src="/result/${recordId}/${img}" class="gallery-img" alt="${img}" loading="lazy">

                                </a>
                                <div class="card-body p-1 text-center">
                                    <small class="text-muted text-truncate d-block">${img}</small>
                                </div>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            };

            const renderConfig = (config) => {
                if (!config || Object.keys(config).length === 0) return;
                document.getElementById('config-section').style.display = 'block';
                document.getElementById('config-data-pre').textContent = JSON.stringify(config, null, 4);
            };

            const renderHistory = (history) => {
                const container = document.getElementById('history-table');
                if (!history || history.length === 0) return;

                document.getElementById('history-section').style.display = 'block';
                const thead = container.querySelector('thead');
                const tbody = container.querySelector('tbody');
                
                let headerHtml = '<tr>';
                Object.keys(history[0]).forEach(key => headerHtml += `<th>${key}</th>`);
                headerHtml += '</tr>';
                thead.innerHTML = headerHtml;

                let bodyHtml = '';
                history.forEach(row => {
                    bodyHtml += '<tr>';
                    Object.values(row).forEach(val => bodyHtml += `<td>${val !== null ? val : ''}</td>`);
                    bodyHtml += '</tr>';
                });
                tbody.innerHTML = bodyHtml;
            };

            const renderTrainingMetrics = (rawData, recordName) => {
                if (!rawData || Object.keys(rawData).length === 0) return;
                
                document.getElementById('charts-section').style.display = 'block';
                if (recordName) {
                    document.getElementById('record-name-source').innerText = `Source: ${recordName}`;
                }

                // --- This logic is mostly the same as the original file ---
                const ctx = document.getElementById('metricsChart').getContext('2d');
                const metricSelect = document.getElementById('metricSelect');
                const rawDataTableHead = document.querySelector('#rawDataTable thead');
                const rawDataTableBody = document.querySelector('#rawDataTable tbody');
                
                const keys = Object.keys(rawData);
                if (keys.length === 0) return;
                
                document.getElementById('raw-data-section').style.display = 'block';

                const numRows = rawData[keys[0]].length;
                
                // --- Populate Raw Data Table ---
                let headRow = '<tr><th>Index</th>';
                keys.forEach(key => headRow += `<th>${key}</th>`);
                headRow += '</tr>';
                rawDataTableHead.innerHTML = headRow;

                let bodyContent = '';
                for (let i = numRows - 1; i >= 0; i--) { 
                    bodyContent += `<tr><td>${i}</td>`;
                    keys.forEach(key => {
                        let val = rawData[key][i];
                        if (val !== null && typeof val === 'number') val = val.toFixed(4);
                        bodyContent += `<td>${val !== null ? val : ''}</td>`;
                    });
                    bodyContent += '</tr>';
                }
                rawDataTableBody.innerHTML = bodyContent;

                // --- Populate Metric Select ---
                keys.forEach(key => {
                    const option = document.createElement('option');
                    option.value = key;
                    option.text = key;
                    if (key.includes('loss')) option.selected = true;
                    metricSelect.appendChild(option);
                });

                function updateChart() {
                    const selectedOptions = Array.from(metricSelect.selectedOptions).map(opt => opt.value);
                    const currentStep = window.globalSlider ? parseInt(window.globalSlider.value) : 0;
                    
                    const datasets = selectedOptions.map((key, index) => {
                        const hue = (index * 137.508) % 360; 
                        return { label: key, data: rawData[key], borderColor: `hsl(${hue}, 70%, 50%)`, backgroundColor: `hsl(${hue}, 70%, 50%, 0.1)`, borderWidth: 2, tension: 0.1, pointRadius: 1 };
                    });
                    
                    const labels = Array.from({length: rawData[selectedOptions[0]]?.length || 0}, (_, i) => i);

                    if (window.metricsChartInstance) window.metricsChartInstance.destroy();

                    window.metricsChartInstance = new Chart(ctx, {
                        type: 'line',
                        data: { labels, datasets },
                        options: {
                            responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                            scales: { x: { type: 'linear', title: { display: true, text: 'Epoch / Step' } }, y: { display: true, title: { display: true, text: 'Value' } } },
                            plugins: { annotation: { annotations: { line1: { type: 'line', xMin: currentStep, xMax: currentStep, borderColor: 'rgba(255, 99, 132, 0.8)', borderWidth: 2, label: { display: true, content: 'Current Step', position: 'start' } } } } }
                        }
                    });
                }

                metricSelect.addEventListener('change', updateChart);
                updateChart();
            };

            const renderMatrixViz = (matrixData) => {
                if (!matrixData || Object.keys(matrixData).length === 0) return;

                document.getElementById('global-control-section').style.display = 'block';
                document.getElementById('matrix-section').style.display = 'block';

                // --- This logic is mostly the same as the original file ---
                const globalSlider = document.getElementById('globalStepSlider');
                window.globalSlider = globalSlider; // Make it globally accessible
                const globalLabel = document.getElementById('globalStepLabel');
                const updateCallbacks = [];
                let globalMaxStep = 0;

                Object.keys(matrixData).forEach(key => {
                    const len = matrixData[key].length;
                    if (len - 1 > globalMaxStep) globalMaxStep = len - 1;
                });

                globalSlider.max = globalMaxStep;
                globalSlider.value = globalMaxStep;
                globalLabel.innerText = `Step: ${globalMaxStep}`;

                globalSlider.addEventListener('input', (e) => {
                    const step = parseInt(e.target.value);
                    globalLabel.innerText = `Step: ${step}`;
                    updateCallbacks.forEach(cb => cb(step));
                    if (window.metricsChartInstance) {
                        const chart = window.metricsChartInstance;
                        if (chart.options.plugins.annotation.annotations.line1) {
                            chart.options.plugins.annotation.annotations.line1.xMin = step;
                            chart.options.plugins.annotation.annotations.line1.xMax = step;
                        }
                        const activeElements = [];
                        chart.data.datasets.forEach((dataset, datasetIndex) => {
                            if (dataset.data[step] !== undefined) activeElements.push({ datasetIndex, index: step });
                        });
                        chart.setActiveElements(activeElements.length > 0 ? activeElements : []);
                        chart.tooltip.setActiveElements(activeElements.length > 0 ? activeElements : [], {x: 0, y: 0});
                        chart.update('none');
                    }
                });
                
                const container = document.getElementById('matrixContainer');
                const matrixCharts = {};
                
                Object.keys(matrixData).forEach(key => {
                    const series = matrixData[key];
                    const maxStep = series.length - 1;
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="card h-100">
                            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                                <small class="fw-bold text-uppercase text-truncate" title="${key}" style="max-width: 100px;">${key}</small>
                                <div class="btn-group btn-group-sm" role="group">
                                    <input type="radio" class="btn-check" name="btnradio-${key}" id="btn-heat-${key}" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="btn-heat-${key}" title="Heatmap View"><i class="bi bi-grid-3x3-gap-fill"></i></label>
                                    <input type="radio" class="btn-check" name="btnradio-${key}" id="btn-line-${key}" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="btn-line-${key}" title="Line Chart View"><i class="bi bi-graph-up"></i></label>
                                </div>
                            </div>
                            <div class="card-body p-2 d-flex flex-column align-items-center justify-content-center position-relative" style="height: 250px; background: #f8f9fa;">
                                <div id="heat-container-${key}" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"><canvas id="canvas-${key}" width="200" height="200" style="width:100%; height:100%; object-fit: contain; image-rendering: pixelated;"></canvas></div>
                                <div id="line-container-${key}" style="width:100%; height:100%; display:none;"><canvas id="chart-${key}"></canvas></div>
                            </div>
                        </div>`;
                    container.appendChild(col);
                    const canvas = col.querySelector(`#canvas-${key}`), chartCanvas = col.querySelector(`#chart-${key}`), heatContainer = col.querySelector(`#heat-container-${key}`), lineContainer = col.querySelector(`#line-container-${key}`), btnHeat = col.querySelector(`#btn-heat-${key}`), btnLine = col.querySelector(`#btn-line-${key}`);
                    let currentMode = 'heatmap';
                    const renderHeatmap = (step, data) => { const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height; ctx.clearRect(0, 0, w, h); const rows = data.length, cols = Array.isArray(data[0]) ? data[0].length : 1, cellW = w / cols, cellH = h / rows; let minVal = Infinity, maxVal = -Infinity; if (Array.isArray(data[0])) data.forEach(row => row.forEach(v => { if (v < minVal) minVal = v; if (v > maxVal) maxVal = v; })); else data.forEach(v => { if (v < minVal) minVal = v; if (v > maxVal) maxVal = v; }); if (maxVal === minVal) maxVal = minVal + 1; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const val = (cols > 1) ? data[r][c] : data[r], norm = (val - minVal) / (maxVal - minVal), intensity = Math.floor(norm * 255); ctx.fillStyle = `rgb(0, ${intensity}, ${intensity + 50})`; ctx.fillRect(c * cellW, r * cellH, cellW, cellH); } };
                    const renderLineChart = (step, data) => { let datasets = [], labels = []; if (Array.isArray(data[0])) { const rows = data.length, cols = data[0].length; labels = Array.from({length: cols}, (_, i) => i); for (let r = 0; r < rows; r++) { const hue = (r * 137.508) % 360; datasets.push({ label: `Row ${r}`, data: data[r], borderColor: `hsl(${hue}, 70%, 50%)`, borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false }); } } else { labels = data.map((_, i) => i); datasets.push({ label: 'Value', data: data, borderColor: 'rgb(75, 192, 192)', borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false }); } if (matrixCharts[key]) { matrixCharts[key].data.labels = labels; matrixCharts[key].data.datasets = datasets; matrixCharts[key].update('none'); } else { const ctx = chartCanvas.getContext('2d'); matrixCharts[key] = new Chart(ctx, { type: 'line', data: { labels, datasets }, options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: true, title: {display: true, text: 'Column Index'} }, y: { display: true } }, plugins: { legend: { display: datasets.length > 1, labels: { boxWidth: 10, font: { size: 10 } } } } } }); } };
                    const updateView = (step) => { const localStep = Math.min(step, maxStep), data = series[localStep]; if (!data) return; if (currentMode === 'heatmap') { heatContainer.style.display = 'flex'; lineContainer.style.display = 'none'; renderHeatmap(localStep, data); } else { heatContainer.style.display = 'none'; lineContainer.style.display = 'block'; requestAnimationFrame(() => renderLineChart(localStep, data)); } };
                    updateCallbacks.push(updateView);
                    btnHeat.addEventListener('change', () => { if (btnHeat.checked) { currentMode = 'heatmap'; const currentGlobalStep = globalSlider ? parseInt(globalSlider.value) : maxStep; updateView(currentGlobalStep); } });
                    btnLine.addEventListener('change', () => { if (btnLine.checked) { currentMode = 'line'; const currentGlobalStep = globalSlider ? parseInt(globalSlider.value) : maxStep; updateView(currentGlobalStep); } });
                    updateView(maxStep);
                });
            };

            // 響應 vs 目標：每個 label 一張，紅虛線目標 + 實線響應 (跟 global slider 捲動)
            const renderRespVsTarget = (api) => {
                const labels = api.resp_labels || [];
                if (!labels.length || !api.responses) return;
                document.getElementById('resp-target-section').style.display = 'block';
                const container = document.getElementById('respTargetContainer');
                const x = api.resp_x || [];
                const C = { S11:'#0d6efd', S21:'#6f42c1', S22:'#198754', Gain:'#fd7e14' };
                const charts = {};
                const nFrames = (api.responses[labels[0]] || []).length;
                const step0 = Math.max(0, nFrames - 1);   // 預設顯示最後一筆
                labels.forEach(lbl => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-xl-4';
                    col.innerHTML = `
                        <div class="card h-100">
                            <div class="card-header py-1 small fw-bold" style="color:${C[lbl]||'#333'}">
                                ${lbl} <span class="text-muted fw-normal">(${lbl==='Gain'?'dBi':'dB'})</span>
                            </div>
                            <div class="card-body p-2" style="height:200px"><canvas id="rt-${lbl}"></canvas></div>
                        </div>`;
                    container.appendChild(col);
                    const tgt = api.targets[lbl] || [];
                    const series = api.responses[lbl] || [];
                    const xs = (x.length && x.length === tgt.length) ? x : (series[0]||tgt).map((_,i)=>i);
                    charts[lbl] = new Chart(col.querySelector(`#rt-${lbl}`).getContext('2d'), {
                        type:'line',
                        data:{ labels: xs, datasets:[
                            { label:'目標', data:tgt, borderColor:'#dc3545', borderDash:[6,4], borderWidth:2, pointRadius:0, fill:false },
                            { label:'響應', data:series[step0]||[], borderColor:C[lbl]||'#0d6efd', borderWidth:2, pointRadius:0, fill:false }
                        ]},
                        options:{ responsive:true, maintainAspectRatio:false, animation:false,
                            plugins:{ legend:{ labels:{ boxWidth:12, font:{size:10} } } },
                            scales:{ x:{ ticks:{ maxTicksLimit:5, font:{size:9} }, title:{ display:true, text:'GHz', font:{size:9} } },
                                     y:{ ticks:{ font:{size:9} } } } }
                    });
                });
                if (window.globalSlider) {
                    window.globalSlider.addEventListener('input', e => {
                        const s = parseInt(e.target.value);
                        labels.forEach(lbl => {
                            const series = api.responses[lbl] || [];
                            charts[lbl].data.datasets[1].data = series[Math.min(s, series.length-1)] || [];
                            charts[lbl].update('none');
                        });
                    });
                }
            };

            // --- CALL RENDER FUNCTIONS ---
            renderTrainingMetrics(apiData.data, apiData.record_name);
            renderMatrixViz(apiData.matrix_data);
            renderRespVsTarget(apiData);
            renderImages(apiData.images);
            renderConfig(apiData.config);
            renderHistory(apiData.history);

        })
        .catch(error => {
            console.error('Error fetching record data:', error);
            loadingIndicator.style.display = 'none';
            errorContainer.innerText = 'Failed to load data from the server. See console for details.';
            errorContainer.style.display = 'block';
        });
});
</script>

</body>
</html>
